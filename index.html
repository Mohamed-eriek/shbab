    <button id="themeToggle" class="theme-toggle" aria-label="تبديل الوضع الليلي" title="تبديل الوضع الليلي">
    <span class="theme-icon">🌙</span>
  </button>

    <div class="page">
     <div class="band">
  <h1>نموذج تسجيل الحضور</h1>
  <p>
    سجّل بياناتك عشان تأكد مكانك في الفعالية، واختار الجلسة اللي تناسبك.
  </p>
</div>

      <form id="registrationForm" method="POST" novalidate>
        <div class="field">
          <label class="field-label" for="fullName">اسم المسجل</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="اكتب اسمك بالكامل"
            required
          />
        </div>

        <div class="field">
          <label class="field-label" for="email">البريد الإلكتروني</label>
          <input 
            
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            required
          />
        </div>

        <div class="field">
          <label class="field-label" for="phone">رقم الهاتف</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="01xxxxxxxxx"
            pattern="[0-9]{10,15}"
            required
          />
        </div>

        <div class="field">
          <span class="field-label">النوع</span>
          <div class="radio-row">
            <label class="choice">
              <input type="radio" name="gender" value="ذكر" required />
              <span>ذكر</span>
            </label>
            <label class="choice">
              <input type="radio" name="gender" value="أنثى" />
              <span>أنثى</span>
            </label>
          </div>
        </div>

        <div class="field">
          <span class="field-label">اختر الفعالية أو الجلسة</span>
          <p class="hint">تقدر تختار أكتر من جلسة لو مواعيدها مختلفة</p>
          <div class="session-list">
            <label class="session-item">
              <input type="checkbox" name="sessions" value="جلسة تعريفية" />
              <span class="session-text">
                <strong>جلسة تعريفية</strong>
                <span>السبت الساعة 10 صباحًا</span>
              </span>
            </label>
            <label class="session-item">
              <input type="checkbox" name="sessions" value="ورشة عملية" />
              <span class="session-text">
                <strong>ورشة عملية</strong>
                <span>الأحد الساعة 1 ظهرًا</span>
              </span>
            </label>
            <label class="session-item">
              <input type="checkbox" name="sessions" value="جلسة ختامية" />
              <span class="session-text">
                <strong>جلسة ختامية</strong>
                <span>الاثنين الساعة 5 عصرًا</span>
              </span>
            </label>
          </div>
          
        </div>

        <button type="submit">إرسال</button>
      </form>


      <div id="successView" class="success-view" hidden>
        <div class="success-icon">✓</div>
        <h2>تم التسجيل بنجاح!</h2>
        <p>شكرًا <span id="successName"></span>، وصلتنا بياناتك وهنتواصل معاك قريب.</p>
        <div class="success-actions">
          <button type="button" id="newRegistrationButton" class="btn-primary">تسجيل شخص تاني</button>
          <button type="button" id="editRegistrationButton" class="btn-secondary">تعديل بياناتي</button>
        </div>
